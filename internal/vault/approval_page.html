<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mux Vault — Approval</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --green: #3fb950; --orange: #d29922; --red: #f85149; --blue: #58a6ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; max-width: 420px; width: 100%; }
  h1 { font-size: 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .icon { font-size: 1.5rem; }
  .field { margin-bottom: 1rem; }
  .label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 0.25rem; }
  .value { font-family: "SF Mono", SFMono-Regular, Consolas, monospace; font-size: 0.9rem; padding: 0.5rem 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; word-break: break-all; }
  .expires { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem; }
  .actions { display: flex; gap: 0.75rem; }
  button { flex: 1; padding: 0.75rem 1rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  button:active { opacity: 0.8; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-approve { background: var(--green); color: #000; }
  .btn-deny { background: var(--red); color: #fff; }
  .status { text-align: center; margin-top: 1.5rem; padding: 1rem; border-radius: 8px; font-weight: 600; display: none; }
  .status.granted { display: block; background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid var(--green); }
  .status.denied { display: block; background: rgba(248,81,73,0.15); color: var(--red); border: 1px solid var(--red); }
  .status.error { display: block; background: rgba(210,153,34,0.15); color: var(--orange); border: 1px solid var(--orange); }
  .status.loading { display: block; color: var(--muted); }
  .loading-spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 0.5em; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h1><span class="icon">&#x1f512;</span> Approval Required</h1>

  <div class="field">
    <div class="label">Action</div>
    <div class="value" id="action">Loading...</div>
  </div>

  <div class="field">
    <div class="label">Context</div>
    <div class="value" id="context">—</div>
  </div>

  <div class="field">
    <div class="label">Requester</div>
    <div class="value" id="requester">—</div>
  </div>

  <div class="expires" id="expires"></div>

  <div class="actions" id="actions">
    <button class="btn-approve" id="btn-approve" onclick="approve()">Approve (FaceID)</button>
    <button class="btn-deny" id="btn-deny" onclick="deny()">Deny</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const approvalID = window.location.pathname.split('/').pop();
const statusEl = document.getElementById('status');
const actionsEl = document.getElementById('actions');

// Load approval details
fetch(`/vault/approval/${approvalID}`)
  .then(r => r.json())
  .then(data => {
    if (data.error) { showStatus('error', data.error); return; }
    document.getElementById('action').textContent = data.action;
    document.getElementById('context').textContent = data.context || '—';
    document.getElementById('requester').textContent = data.requester || '—';
    if (data.expires_at) {
      const exp = new Date(data.expires_at);
      const mins = Math.max(0, Math.round((exp - Date.now()) / 60000));
      document.getElementById('expires').textContent = `Expires in ${mins} minutes`;
    }
    if (data.state !== 'pending') {
      showStatus(data.state, `Already ${data.state}`);
      actionsEl.style.display = 'none';
    }
  })
  .catch(err => showStatus('error', `Failed to load: ${err.message}`));

async function approve() {
  const btnApprove = document.getElementById('btn-approve');
  const btnDeny = document.getElementById('btn-deny');
  btnApprove.disabled = true;
  btnDeny.disabled = true;
  showStatus('loading', '<span class="loading-spinner"></span>Authenticating...', true);

  try {
    // Step 1: Begin WebAuthn login
    const beginResp = await fetch('/vault/webauthn/login/begin', { method: 'POST' });
    if (!beginResp.ok) {
      const err = await beginResp.json();
      throw new Error(err.error || 'WebAuthn begin failed');
    }
    const options = await beginResp.json();

    // Step 2: Browser WebAuthn API (triggers FaceID / YubiKey)
    const credential = await navigator.credentials.get({
      publicKey: {
        challenge: base64urlToBuffer(options.publicKey.challenge),
        timeout: options.publicKey.timeout,
        rpId: options.publicKey.rpId,
        allowCredentials: (options.publicKey.allowCredentials || []).map(c => ({
          id: base64urlToBuffer(c.id),
          type: c.type,
          transports: c.transports,
        })),
        userVerification: options.publicKey.userVerification || 'preferred',
      }
    });

    // Step 3: Send assertion to server (this also unlocks the vault)
    const assertionBody = JSON.stringify({
      id: credential.id,
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        authenticatorData: bufferToBase64url(credential.response.authenticatorData),
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
        signature: bufferToBase64url(credential.response.signature),
        userHandle: credential.response.userHandle ? bufferToBase64url(credential.response.userHandle) : null,
      }
    });

    const finishResp = await fetch('/vault/webauthn/login/finish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: assertionBody,
    });

    if (!finishResp.ok) {
      const err = await finishResp.json();
      throw new Error(err.error || 'WebAuthn verification failed');
    }

    // Extract session token from WebAuthn login response
    const finishData = await finishResp.json();
    const sessionToken = finishData.session_token;

    // Step 4: Grant the specific approval (with session token proof)
    const grantResp = await fetch(`/vault/approval/${approvalID}/grant`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_token: sessionToken }),
    });
    if (!grantResp.ok) {
      const err = await grantResp.json();
      throw new Error(err.error || 'Grant failed');
    }

    showStatus('granted', 'Approved — vault unlocked');
    actionsEl.style.display = 'none';

  } catch (err) {
    showStatus('error', err.message || 'Authentication failed');
    btnApprove.disabled = false;
    btnDeny.disabled = false;
  }
}

async function deny() {
  try {
    const resp = await fetch(`/vault/approval/${approvalID}/deny`, { method: 'POST' });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error || 'Deny failed');
    }
    showStatus('denied', 'Denied');
    actionsEl.style.display = 'none';
  } catch (err) {
    showStatus('error', err.message);
  }
}

function showStatus(type, text, useHTML) {
  statusEl.className = 'status ' + type;
  if (useHTML) {
    statusEl.innerHTML = text;
  } else {
    statusEl.textContent = text;
  }
}

// --- base64url helpers (WebAuthn uses base64url, not standard base64) ---

function base64urlToBuffer(base64url) {
  const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
  const pad = base64.length % 4;
  const padded = pad ? base64 + '='.repeat(4 - pad) : base64;
  const binary = atob(padded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function bufferToBase64url(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}
</script>
</body>
</html>
