# mux (MCP Unified Exchange) Configuration
# Copy to ~/.mux/config.toml and adjust values.
# Secrets (passwords, tokens, keys) should be stored via the encrypted vault, OS keychain,
# or the secret_set MCP tool — they are NOT stored in this file.

[server]
port = 7700                                  # HTTP port (always localhost, for MCP clients)
# stdio_proxy = "auto"                     # stdio alongside a running instance: "auto" bridges to it
#                                          # (default), "never" starts a full standalone instance,
#                                          # "always" refuses to start without one
# tls_cert = "/path/to/cert.pem"           # TLS certificate — enables HTTPS server for WebAuthn/Vault
# tls_key = "/path/to/key.pem"             # TLS private key
# tls_port = 7701                          # HTTPS port (default: port + 1), binds to all interfaces

# --- Encrypted Vault (optional) ---
# Hardware-security-grade secret storage with WebAuthn/FIDO2 unlock.
# When enabled, secrets are encrypted at rest with AES-256-GCM.
# [vault]
# enabled = true
# exclusive = true                          # skip legacy keyring/file writes
# inactivity_timeout = "30m"               # auto-lock after inactivity
# webauthn_rp_id = "mux.example.com"       # WebAuthn Relying Party ID (your hostname)
# webauthn_origins = ["https://mux.example.com:7701"]
# base_url = "https://mux.example.com:7701" # public URL for approval links
# Approval notifications (set secrets via MCP secret_set tool):
#   Telegram: secret_set key=vault-telegram-bot-token value=123:ABC...
#             secret_set key=vault-telegram-chat-id value=-100123456789
#   Discord:  secret_set key=vault-discord-webhook value=https://discord.com/api/webhooks/...

# Remote Provisioning (optional)
# Fetches connections and tunnels from one or more central provisioning servers.
# Each endpoint is an [[provisioning]] block. The `name` identifies the
# endpoint so its token can be stored separately:
#   - unnamed/default endpoint  → secret key: "provisioning-token"
#   - named endpoint "foo"       → secret key: "provisioning-foo-token"
# The legacy single `[provisioning]` table is still accepted and migrated
# transparently on load.
#
# [[provisioning]]
# endpoint = "https://provisioning.example.com/api/mux/provision"
#
# [[provisioning]]
# name = "secondary"
# endpoint = "https://admin.example.com/api/mux/provision"

# --- Connections ---
# Define any number of database or proxy connections.
# Each connection registers MCP tools as {name}_{tool}.

# PostgreSQL
[[connections]]
name = "production"
type = "postgresql"
host = "localhost"
port = 5432
user = "readonly"
database = "mydb"
read_only = true
# tunnel = "office-vpn"                  # optional: route through WireGuard tunnel
# instructions = "Production database."  # optional: added to MCP server instructions
# Password stored as secret (key: "production-password")

# ClickHouse
# [[connections]]
# name = "analytics"
# type = "clickhouse"
# host = "localhost"
# port = 8123                            # 8123/8443 = HTTP, other = native TCP
# user = "default"
# database = "default"
# secure = false                         # TLS for HTTP protocol
# Password stored as secret (key: "analytics-password")

# MariaDB
# [[connections]]
# name = "local-dev"
# type = "mariadb"
# host = "localhost"
# port = 3306
# user = "root"
# database = "myapp"
# read_only = false                      # false enables {name}_execute tool
# Password stored as secret (key: "local-dev-password")

# Proxy: Bearer token (e.g. YouTrack's built-in MCP server)
# [[connections]]
# name = "youtrack"
# type = "proxy"
# url = "https://instance.myjetbrains.com/mcp"
# Token stored as secret (key: "youtrack-token")

# YouTrack over its REST API (issues, comments, history, attachments, boards, admin)
# [[connections]]
# name = "youtrack-rest"
# type = "youtrack-rest"
# url = "https://instance.youtrack.cloud"      # or https://host/youtrack — no /api, no /mcp
# read_only = false                             # true: reading tools only
# protected_fields = ["P:Sprint priority"]      # never written through this connection
# set_once_fields = ["P:Department"]            # written only while still empty
# Token stored as secret (key: "youtrack-rest-token")

# Proxy: OAuth 2.0 + PKCE (e.g. Sentry — type "sentry" defaults oauth=true)
# [[connections]]
# name = "sentry"
# type = "sentry"
# url = "https://mcp.sentry.dev/mcp"
# OAuth tokens stored as secret (key: "sentry-oauth-token")

# Higgsfield (cinematic image/video generation) — OAuth 2.0 + PKCE with
# dynamic client registration. type "higgsfield" defaults oauth=true, the URL
# below, and scopes "openid email offline_access".
# [[connections]]
# name = "higgsfield"
# type = "higgsfield"
# url = "https://mcp.higgsfield.ai/mcp"  # optional, this is the default
# OAuth tokens stored as secret (key: "higgsfield-oauth-token")

# Google Gemini (image generation + multimodal AI)
# [[connections]]
# name = "gemini"
# type = "gemini"
# url = "https://generativelanguage.googleapis.com/v1beta"  # optional, this is the default
# Token stored as secret (key: "gemini-token")

# HTTP API (generic REST client)
# [[connections]]
# name = "my-api"
# type = "http"
# url = "https://api.example.com"
# token_header = "x-api-key"               # custom auth header (default: Authorization: Bearer)
# Token stored as secret (key: "my-api-token")
# Extra headers sent with every request (e.g. API version headers):
# [connections.headers]
# "Notion-Version" = "2022-06-28"

# SSH host: commands and file copies, key held by mux (or the user's ssh-agent)
# [[connections]]
# name = "web01"
# type = "ssh"
# host = "web01.internal.example.com"
# port = 22
# user = "deploy"
# auth = "key"                                  # default; "agent" = the ssh-agent of the user running mux
# key_file = "~/.ssh/id_ed25519"                # optional: read the key from a file instead of the secret
# host_key = "ssh-ed25519 AAAAC3… web01"        # optional: pin the server key; empty = known_hosts decides
# read_only = true                              # no upload; exec limited to allow_commands or the built-in reading list
# allow_commands = ["systemctl status", "journalctl"]   # optional, leading tokens; replaces the built-in list
# deny_commands = ["journalctl --vacuum*"]              # optional, always wins
# Private key stored as secret (key: "web01-private-key"), passphrase as "web01-private-key-passphrase"

# IMAP mailbox: conversations, archive/delete, reply and forward drafts —
# optionally sending over SMTP with the same account
# [[connections]]
# name = "mail"
# type = "imap"
# host = "imap.example.com"
# port = 993                                    # IMAPS
# user = "jane@example.com"
# from_name = "Jane Doe"                        # optional: display name in From
# smtp_host = "smtp.example.com"                # optional: submission server, same user and password
# smtp_port = 587                               # 587 = STARTTLS (default), 465 = implicit TLS
# allow_send = true                             # registers send_draft, reply_send, forward_send; smtp_host alone does not; user must be an address
# smtp_saves_sent = false                       # true when the provider files SMTP mail in Sent itself (Gmail)
# Password stored as secret (key: "mail-password")

# Nylas: a mailbox behind the Nylas API (Gmail, Microsoft 365, IMAP — one type).
# Conversations are Nylas threads with the account's own replies, each with a ball position.
# [[connections]]
# name = "mailbox"
# type = "nylas"
# region = "eu"                                 # us (default) | eu — the region of the Nylas application
# grant_id = "00000000-0000-0000-0000-000000000000"  # the connected mailbox; or set user to its address and mux looks it up
# user = "jane@example.com"                     # optional: mailbox address (own address for replies; read from the grant otherwise)
# from_name = "Jane Doe"                        # optional: display name in From
# allow_send = true                             # registers send_draft, reply_send, forward_send (Nylas sends; no SMTP needed)
# API key stored as secret (key: "mailbox-token") — an IAM key bound to the grant, with an expiry

# --- Tunnels ---
# Connections can reference tunnels by name to route traffic through WireGuard or SSH.

# [[tunnels]]
# name = "office-vpn"
# peer_public_key = "xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg="
# peer_endpoint = "vpn.example.com:51820"
# allowed_ips = "10.100.0.0/16"
# tunnel_address = "10.100.0.42/32"
# dns = "10.100.0.1"                     # optional
# mtu = 1420                             # optional, default: 1420
# keepalive = 25                         # optional, default: 25 seconds
# Private key stored as secret (key: "tunnel-office-vpn-private-key")
# Preshared key stored as secret (key: "tunnel-office-vpn-preshared-key")

# [[tunnels]]
# name = "bastion"
# type = "ssh"
# host = "bastion.example.com"
# port = 22
# user = "deploy"
# auth = "key"                           # default; "agent" uses the ssh-agent of the user running mux
# key_file = "~/.ssh/id_ed25519"         # optional, instead of the stored key
# Private key stored as secret (key: "tunnel-bastion-private-key"); passphrase, if encrypted,
# as "tunnel-bastion-private-key-passphrase". Host key: known_hosts in the mux config dir or ~/.ssh.

# --- Legacy Format ---
# The old single-section format is still supported and auto-migrated:
#
# [mariadb]
# host = "localhost"
# ...
#
# [clickhouse]
# host = "localhost"
# ...
#
# [youtrack]
# url = "https://..."
#
# These are automatically converted to [[connections]] entries on save.
